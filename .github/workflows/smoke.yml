name: Smoke CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          echo "✅ Smoke CI is running..."
          uname -a || true
          git --version || true
          python3 --version || true
          echo "✅ Done."
