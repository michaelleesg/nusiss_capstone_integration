name: CI

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.cfg"
      - "mypy.ini"
      - "pytest.ini"
      - ".ruff.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install ruff black pytest pytest-cov mypy bandit pip-audit

      - name: Ruff (lint)
        run: ruff check --output-format=github . || true

      - name: Black (format check)
        run: black --check . || true

      - name: Mypy (type check)
        run: mypy . || true

      - name: Bandit (security)
        run: bandit -r . || true

      - name: Tests
        run: pytest -q --cov=. --cov-report=xml --cov-report=term || true
