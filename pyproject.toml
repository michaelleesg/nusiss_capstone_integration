[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".aider.tags.cache.v4", "legacy"]

[tool.ruff.lint]
# Equivalent to what you wanted from both sides of the conflict
select = ["E", "F", "I", "UP"]
ignore = ["E203", "E266", "E501"]
